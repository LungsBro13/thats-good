name: iOS build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Logic tests
        run: |
          set +e
          swiftc ThatsGood/Logic/*.swift Tests/LogicTests/main.swift -o "$RUNNER_TEMP/logic-tests" > "$RUNNER_TEMP/swiftc.log" 2>&1
          compiled=$?
          cat "$RUNNER_TEMP/swiftc.log"
          if [ $compiled -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/swiftc.log" | sort -u | head -10 | while read -r line; do echo "::error title=Logic compile::$line"; done
            exit $compiled
          fi
          "$RUNNER_TEMP/logic-tests" > "$RUNNER_TEMP/tests.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/tests.log"
          grep "^FAIL" "$RUNNER_TEMP/tests.log" | head -10 | while read -r line; do echo "::error title=Logic test::$line"; done
          echo "::notice title=Logic tests::$(tail -1 "$RUNNER_TEMP/tests.log")"
          exit $status

      - name: Build app for the simulator
        run: |
          set +e
          xcodebuild -project ThatsGood.xcodeproj -scheme ThatsGood -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          set -e
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" || true
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -10 | while read -r line; do echo "::error title=Build::$line"; done
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" "$RUNNER_TEMP/build.log" | grep -v SourcePackages | sort -u | head -10 | while read -r line; do echo "::warning title=Build::$line"; done
          echo "::notice title=Build::Xcode $(xcodebuild -version | head -1), exit $status, $(grep -E '\.swift:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/build.log" | grep -v SourcePackages | sort -u | wc -l | tr -d ' ') Swift warnings in our code, $(grep -oE 'BUILD (SUCCEEDED|FAILED)' "$RUNNER_TEMP/build.log" | tail -1)"
          exit $status

      - name: Check OpenStreetMap data for the test course
        if: startsWith(github.ref, 'refs/heads/phase-')
        run: |
          q='[out:json][timeout:25];(way["golf"~"^(green|hole)$"](around:1500,56.3445,-2.8090););out tags;'
          code=$(curl -s -m 40 -o "$RUNNER_TEMP/osm.json" -w "%{http_code}" -A "ThatsGood-CI" --data-urlencode "data=$q" https://overpass-api.de/api/interpreter || echo fail)
          holes=$(grep -o '"golf": *"hole"' "$RUNNER_TEMP/osm.json" | wc -l | tr -d ' ')
          greens=$(grep -o '"golf": *"green"' "$RUNNER_TEMP/osm.json" | wc -l | tr -d ' ')
          echo "::notice title=OpenStreetMap::HTTP $code, $holes hole lines, $greens greens near the Old Course"

      - name: Launch in the simulator and take screenshots
        if: startsWith(github.ref, 'refs/heads/phase-')
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 \(" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$udid" build/dd/Build/Products/Debug-iphonesimulator/ThatsGood.app
          mkdir -p "$RUNNER_TEMP/shots"
          for tab in home stats play bag; do
            xcrun simctl terminate "$udid" com.lungsbro13.thatsgood 2>/dev/null || true
            xcrun simctl launch "$udid" com.lungsbro13.thatsgood -demoData -tab "$tab"
            sleep 6
            xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running after opening the $tab tab"; exit 1; }
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/$tab.png"
          done
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood 2>/dev/null || true
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -demoData -tab play -openRound
          sleep 6
          xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running after opening a round"; exit 1; }
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/scoring.png"
          # Detailed mode on a real course from OpenStreetMap, standing on the 1st tee of the Old Course
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood 2>/dev/null || true
          xcrun simctl uninstall "$udid" com.lungsbro13.thatsgood
          xcrun simctl install "$udid" build/dd/Build/Products/Debug-iphonesimulator/ThatsGood.app
          xcrun simctl privacy "$udid" grant location com.lungsbro13.thatsgood
          xcrun simctl location "$udid" set 56.34315,-2.80265
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab play -osmDemo
          sleep 45
          xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running in Detailed mode"; exit 1; }
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/detailed.png"
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -demoData -tab stats
          sleep 6
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/stats-sg.png"
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab bag
          sleep 6
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/bag-clubs.png"
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab friends -socialDemo
          sleep 6
          xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running on the Friends tab"; exit 1; }
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/friends.png"
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab friends -socialDemo -openMatch
          sleep 6
          xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running on a live match"; exit 1; }
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/match.png"
          for kind in cup stroke knockout lobby; do
            xcrun simctl terminate "$udid" com.lungsbro13.thatsgood 2>/dev/null || true
            xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab friends -socialDemo -openTournament "$kind"
            sleep 6
            xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running on the $kind tournament"; exit 1; }
            xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/tour-$kind.png"
          done
          xcrun simctl terminate "$udid" com.lungsbro13.thatsgood
          xcrun simctl launch "$udid" com.lungsbro13.thatsgood -tab friends -socialDemo -openTournament cup -tourScoring
          sleep 7
          xcrun simctl spawn "$udid" launchctl list | grep -q thatsgood || { echo "::error title=Launch::App was not running on tournament scoring"; exit 1; }
          xcrun simctl io "$udid" screenshot "$RUNNER_TEMP/shots/tour-scoring.png"
          echo "::notice title=Launch::App opened all tabs, the scoring screen, Detailed mode, Friends, matches and tournaments without crashing"

      - name: Save screenshots to the ci-screens branch
        if: startsWith(github.ref, 'refs/heads/phase-')
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-screens
          git rm -rfq .
          cp "$RUNNER_TEMP"/shots/*.png .
          git add *.png
          git commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -fq origin ci-screens
